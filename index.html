<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda de Trueques y Ropa</title>
    <!-- Enlace al manifest para que sea una PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS para un diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Barra de Navegación -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">👕 TruequeApp</h1>
            <nav class="space-x-4">
                <a href="index.html" class="hover:underline">Inicio</a>
                <a href="publicar.html" class="hover:underline">Publicar</a>
                <a href="login.html" class="bg-white text-indigo-600 px-3 py-1 rounded-md font-semibold">Entrar</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal (Catálogo de Prendas) -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Prendas disponibles</h2>
        
        <!-- Aquí se cargarán dinámicamente las prendas con JavaScript -->
        <div id="contenedor-prendas" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Ejemplo de tarjeta estática de prenda -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="h-48 bg-gray-200 flex items-center justify-center text-gray-400">Imagen de prenda</div>
                <div class="p-4">
                    <h3 class="font-bold text-lg text-gray-800">Campera de Jean</h3>
                    <p class="text-sm text-gray-600 mb-2">Estado: Usada (Excelente)</p>
                    <p class="text-indigo-600 font-semibold mb-4">Trueque / Venta</p>
                    <button class="w-full bg-indigo-600 text-white py-2 rounded font-medium hover:bg-indigo-700">Me interesa</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Script principal -->
    <script src="js/app.js"></script>
</body>
</html>
